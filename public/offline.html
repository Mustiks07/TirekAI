<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c33"><title>TirekAI · Офлайн</title><style>body{margin:0;background:#f5f6f2;color:#263f35;font:16px/1.7 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{max-width:480px;margin:24px;padding:36px;border:1px solid #dce4d8;background:#fff;border-radius:20px}img{width:64px;height:64px}h1{font-size:28px;line-height:1.3}p{color:#4e6252}a{display:inline-block;background:#24634d;color:white;padding:12px 22px;border-radius:9px;text-decoration:none}nav{display:flex;gap:8px;margin-top:20px}button{font:inherit;background:#eef2e9;color:#294b36;border:1px solid #c6d1c0;padding:6px 12px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{font-weight:700;border-color:#24634d}</style></head><body><main><img src="/icons/app-192.png" alt="TirekAI"><nav aria-label="Тіл / Язык"><button id="kk" aria-pressed="true">ҚАЗ</button><button id="ru" aria-pressed="false">РУС</button></nav><h1 id="title">Байланыс жоқ</h1><p id="body">Жұмысты жалғастыру үшін интернетке немесе жергілікті серверге қосылыңыз. Деректер мен операциялар офлайн режимде қолжетімсіз.</p><a id="retry" href="/">Қайта ашу</a></main><script>const copy={kk:["Байланыс жоқ","Жұмысты жалғастыру үшін интернетке немесе жергілікті серверге қосылыңыз. Деректер мен операциялар офлайн режимде қолжетімсіз.","Қайта ашу"],ru:["Нет соединения","Подключитесь к интернету или локальному серверу, чтобы продолжить работу. Данные и операции недоступны в офлайн-режиме.","Открыть снова"]};function language(l){document.documentElement.lang=l;["title","body","retry"].forEach((id,i)=>document.getElementById(id).textContent=copy[l][i]);["kk","ru"].forEach(k=>document.getElementById(k).setAttribute("aria-pressed",String(k===l)))}document.getElementById("kk").onclick=()=>language("kk");document.getElementById("ru").onclick=()=>language("ru");language(document.cookie.includes("smb_locale=ru")?"ru":"kk");</script></body></html>
